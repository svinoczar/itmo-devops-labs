apiVersion: v1
kind: Pod
metadata:
  name: network-client
  namespace: shop
  labels:
    app.kubernetes.io/name: network-client
    app.kubernetes.io/part-of: shop
    network-role: network-client
    owner: sashka
spec:
  containers:
    - name: client
      image: registry.local/shop/worker:1.0.0
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c", "sleep 86400"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
  restartPolicy: Never

---

apiVersion: v1
kind: Pod
metadata:
  name: outsider
  namespace: shop
  labels:
    app.kubernetes.io/name: outsider
    app.kubernetes.io/part-of: shop
    owner: sashka
spec:
  containers:
    - name: outsider
      image: registry.local/shop/worker:1.0.0
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c", "sleep 86400"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
  restartPolicy: Never
