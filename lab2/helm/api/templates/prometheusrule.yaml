{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
    release: kube-prom
spec:
  groups:
    - name: api.rules
      interval: 30s
      rules:
        - alert: HighErrorRate
          expr: sum(rate(http_request_errors_total{job="api"}[5m])) / sum(rate(http_requests_total{job="api"}[5m])) > 0.05
          for: 2m
          labels:
            severity: critical
            service: api
          annotations:
            summary: "Высокая доля ошибок на api (>5%)"
            description: "Доля ошибок 5xx превысила 5% за последние 5 минут. Смотрите логи в Grafana и трейсы в Jaeger."

        - alert: HighLatency
          expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="api"}[5m]))) > 0.5
          for: 2m
          labels:
            severity: warning
            service: api
          annotations:
            summary: "Высокий p95 на api (>0.5s)"
            description: "p95 времени ответа превысил 500 мс. Смотрите трейсы в Jaeger."

        - alert: ServiceDown
          expr: (up{job="api"} == 0) or (absent(up{job="api"}) == 1)
          for: 1m
          labels:
            severity: critical
            service: api
          annotations:
            summary: "api недоступен"
            description: "Prometheus не может скрейпить api (up=0 или таргет отсутствует). P1-инцидент."
{{- end }}