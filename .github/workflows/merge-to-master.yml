name: Merge To Master Action

on:
  pull_request:
    types: [closed]
    branches:
      - master

jobs:
  organize:
    if: >
      github.event.pull_request.merged == true &&
      (
        github.event.pull_request.head.ref == 'sashka' ||
        github.event.pull_request.head.ref == 'maria-maria' ||
        github.event.pull_request.head.ref == 'sergo'
      )

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Get source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch-depth: 0

      - name: Organize changed labs
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e

          echo "Branch: $BRANCH"
          echo "Base: $BASE_SHA"
          echo "Head: $HEAD_SHA"

          cd source

          # Получаем только файлы, измененные в PR
          git diff --name-status -M "$BASE_SHA" "$HEAD_SHA" > /tmp/changes.txt

          cd ..

          while IFS=$'\t' read -r STATUS PATH OLD_PATH; do
            # Пропускаем пустые строки
            [ -z "$PATH" ] && continue

            # Нас интересуют только lab1, lab2, lab3 и т.д.
            if [[ "$PATH" != lab*/* ]]; then
              continue
            fi

            LAB="${PATH%%/*}"

            echo ""
            echo "Processing: $STATUS $PATH"

            case "$STATUS" in

              A|M)
                # Добавленный или измененный файл
                TARGET="$LAB/$BRANCH/$PATH"

                # Убираем labN/ из пути
                RELATIVE_PATH="${PATH#*/}"
                TARGET="$LAB/$BRANCH/$RELATIVE_PATH"

                mkdir -p "$(dirname "$TARGET")"

                cp "source/$PATH" "$TARGET"

                # Удаляем файл, который Git добавил в корень labN
                rm -f "$PATH"

                echo "  source/$PATH"
                echo "       -> $TARGET"
                ;;

              D)
                # Файл удален в исходной ветке
                RELATIVE_PATH="${PATH#*/}"
                TARGET="$LAB/$BRANCH/$RELATIVE_PATH"

                rm -f "$TARGET"

                # Удаляем возможный файл из корня labN
                rm -f "$PATH"

                echo "  deleted $TARGET"
                ;;

              R*)
                # Rename: удаляем старый файл
                OLD_RELATIVE="${OLD_PATH#*/}"
                OLD_TARGET="$LAB/$BRANCH/$OLD_RELATIVE"

                rm -f "$OLD_TARGET"

                # И добавляем новый
                RELATIVE_PATH="${PATH#*/}"
                TARGET="$LAB/$BRANCH/$RELATIVE_PATH"

                mkdir -p "$(dirname "$TARGET")"

                cp "source/$PATH" "$TARGET"

                rm -f "$OLD_PATH"
                rm -f "$PATH"

                echo "  renamed:"
                echo "    $OLD_TARGET"
                echo "    -> $TARGET"
                ;;

            esac

          done < /tmp/changes.txt

          rm -rf source

      - name: Commit changes
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: organize labs from $BRANCH"
          git push origin master
