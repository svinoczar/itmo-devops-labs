apiVersion: v1
kind: Pod
metadata:
  name: bad-latest
  namespace: shop
  labels:
    app: demo
    owner: maria
spec:
  containers:
    - name: app
      image: docker.io/library/nginx:latest
      resources:
        limits:
          cpu: "100m"
          memory: "128Mi"
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false