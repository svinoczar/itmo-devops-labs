apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: {{ .Values.global.partOf }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    owner: {{ .Values.global.owner }}

spec:
  replicas: {{ .Values.api.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: {{ .Values.global.partOf }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        owner: {{ .Values.global.owner }}

    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}

          env:
            - name: HEALTH_FAIL
              value: {{ .Values.api.env.HEALTH_FAIL | quote }}
            - name: SPRING_SQL_INIT_MODE
              value: {{ .Values.global.database.initMode | quote }}

          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: {{ .Values.api.health.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: {{ .Values.api.health.path }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10

          startupProbe:
            httpGet:
              path: {{ .Values.api.health.path }}
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36