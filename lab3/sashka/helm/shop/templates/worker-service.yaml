apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: {{ .Values.global.partOf }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    owner: {{ .Values.global.owner }}

spec:
  selector:
    app.kubernetes.io/name: worker
    app.kubernetes.io/instance: {{ .Release.Name }}

  ports:
    - name: http
      port: {{ .Values.worker.service.port }}
      targetPort: http