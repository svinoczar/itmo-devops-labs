global:
  partOf: shop
  owner: sashka
  database:
    initMode: never

api:
  replicaCount: 4
  image:
    repository: registry.local/shop/api
    tag: "1.0.1"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  health:
    path: /health
  env:
    HEALTH_FAIL: "false"

worker:
  replicaCount: 2
  image:
    repository: registry.local/shop/worker
    tag: "1.0.0"
    pullPolicy: IfNotPresent  
  service:
    port: 8081
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  health:
    path: /health
  env:
    dbHealthEnabled: "false"