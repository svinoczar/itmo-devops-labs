spring.application.name=shop-worker
server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:shop}
spring.datasource.username=${DB_USER:shop}
spring.datasource.password=${DB_PASSWORD:shop}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.sql.init.mode=always

worker.poll-interval-ms=${WORKER_POLL_INTERVAL_MS:2000}
worker.batch-size=${WORKER_BATCH_SIZE:10}

management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.path-mapping.prometheus=metrics
management.metrics.tags.service=${spring.application.name}
