apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-labels

spec:
  replicas: 1

  selector:
    matchLabels:
      app: missing-labels

  template:
    metadata:
      labels:
        app: missing-labels

    spec:
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10