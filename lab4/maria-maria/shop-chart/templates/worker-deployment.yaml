apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Release.Namespace }}
  labels:
    app: worker
    owner: shop
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        owner: shop
    spec:
      priorityClassName: shop-critical
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          env:
            - name: DB_HOST
              value: {{ .Values.worker.env.DB_HOST | quote }}
            - name: DB_PORT
              value: {{ .Values.worker.env.DB_PORT | quote }}
            - name: DB_NAME
              value: {{ .Values.worker.env.DB_NAME | quote }}
            - name: DB_USER
              value: {{ .Values.worker.env.DB_USER | quote }}
            - name: DB_PASSWORD
              value: {{ .Values.worker.env.DB_PASSWORD | quote }}
            - name: POLL_INTERVAL
              value: {{ .Values.worker.env.POLL_INTERVAL | quote }}
          resources:
            requests:
              cpu: {{ .Values.worker.resources.requests.cpu }}
              memory: {{ .Values.worker.resources.requests.memory }}
            limits:
              cpu: {{ .Values.worker.resources.limits.cpu }}
              memory: {{ .Values.worker.resources.limits.memory }}